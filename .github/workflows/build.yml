name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2025

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore SKAutoWorkTracking.sln

    - name: Build
      run: dotnet build SKAutoWorkTracking.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test SKAutoWorkTracking.sln --configuration Release --no-build --verbosity normal

    - name: Publish (UI only)
      run: dotnet publish Source/SKAuto.UI/SKAuto.UI.csproj --configuration Release --output ./publish

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: ./publish
